name: Fieldwork dev closeBundle repair

on:
  pull_request:
    branches:
      - upstream/unit-01-vite-main-e6b6b167

permissions:
  contents: read

jobs:
  baseline-and-candidate:
    if: >-
      github.repository == 'teamleaderleo/vite' &&
      github.head_ref == 'execution/dev-closebundle-after-buildend-failure'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact baseline
        uses: actions/checkout@v6
        with:
          ref: e6b6b167afa0a80548829d1f24a0712f9194389a
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Prove baseline skips closeBundle
        shell: bash
        run: |
          set -euo pipefail
          git show f3e0662a0becd344437c4988103d6082604c1ec6:packages/vite/src/node/server/__tests__/pluginContainer-close.spec.ts > packages/vite/src/node/server/__tests__/pluginContainer-close.spec.ts
          set +e
          pnpm test-unit packages/vite/src/node/server/__tests__/pluginContainer-close.spec.ts > baseline.log 2>&1
          status=$?
          set -e
          cat baseline.log
          test "$status" -ne 0
          grep -F "runs closeBundle when buildEnd fails" baseline.log
          grep -F "retains buildEnd and closeBundle failures" baseline.log

      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: f3e0662a0becd344437c4988103d6082604c1ec6
          clean: true
          fetch-depth: 0

      - name: Verify exact two-file fence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f3e0662a0becd344437c4988103d6082604c1ec6"
          test "$(git diff --name-only e6b6b167afa0a80548829d1f24a0712f9194389a...HEAD | sort)" = $'packages/vite/src/node/server/__tests__/pluginContainer-close.spec.ts\npackages/vite/src/node/server/pluginContainer.ts'
          test -z "$(git status --porcelain)"

      - name: Run focused repair controls
        shell: bash
        run: |
          set -euo pipefail
          pnpm test-unit packages/vite/src/node/server/__tests__/pluginContainer-close.spec.ts

      - name: Run static and formatting gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter vite typecheck
          pnpm exec eslint --no-cache --concurrency auto packages/vite/src/node/server/pluginContainer.ts packages/vite/src/node/server/__tests__/pluginContainer-close.spec.ts
          pnpm exec oxfmt --check packages/vite/src/node/server/pluginContainer.ts packages/vite/src/node/server/__tests__/pluginContainer-close.spec.ts
          git diff --check e6b6b167afa0a80548829d1f24a0712f9194389a...HEAD
          test -z "$(git status --porcelain)"
