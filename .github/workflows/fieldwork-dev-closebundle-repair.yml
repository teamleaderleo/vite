name: Fieldwork dev closeBundle repair

on:
  pull_request:
    branches:
      - upstream/unit-01-vite-main-e6b6b167

permissions:
  contents: write

jobs:
  baseline-and-candidate:
    if: >-
      github.repository == 'teamleaderleo/vite' &&
      github.head_ref == 'execution/dev-closebundle-after-buildend-failure'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact baseline
        uses: actions/checkout@v6
        with:
          ref: e6b6b167afa0a80548829d1f24a0712f9194389a
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Build exact baseline package
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter vite build

      - name: Prove exact baseline close lifecycle defects
        shell: bash
        run: |
          set -euo pipefail
          TEST_FILE=packages/vite/src/node/server/__tests__/pluginContainer-close.spec.ts
          git show ef590b56365742d25a363af21b0a35580c62708d:"$TEST_FILE" > "$TEST_FILE"
          set +e
          pnpm test-unit "$TEST_FILE" --reporter=json --outputFile=baseline.json
          status=$?
          set -e
          test "$status" -ne 0
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('baseline.json', 'utf8'))
          const failed = report.testResults
            .flatMap((suite) => suite.assertionResults ?? [])
            .filter((test) => test.status === 'failed')
            .map((test) => test.fullName)
            .sort()
          const expected = [
            'continues sequential lifecycle hooks and retains ordered failures',
            'retains buildEnd and closeBundle failures',
            'runs closeBundle when buildEnd fails',
            'waits for all buildEnd hooks before closeBundle after a failure',
          ].sort()
          console.log({ failed, expected, numFailedTests: report.numFailedTests })
          if (report.numFailedTests !== expected.length) process.exit(1)
          if (JSON.stringify(failed) !== JSON.stringify(expected)) process.exit(1)
          NODE

      - name: Check out exact repair input
        uses: actions/checkout@v6
        with:
          ref: ef590b56365742d25a363af21b0a35580c62708d
          clean: true
          fetch-depth: 0

      - name: Verify exact repair input fence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ef590b56365742d25a363af21b0a35580c62708d"
          test "$(git diff --name-only e6b6b167afa0a80548829d1f24a0712f9194389a...HEAD | sort)" = $'packages/vite/src/node/server/__tests__/pluginContainer-close.spec.ts\npackages/vite/src/node/server/pluginContainer.ts'
          test -z "$(git status --porcelain)"

      - name: Apply barrier-safe lifecycle scheduler
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('packages/vite/src/node/server/pluginContainer.ts')
          text = path.read_text()

          helper_anchor = '''    await Promise.all(parallelPromises)
          }

          async buildStart(_options?: InputOptions): Promise<void> {
          '''.replace('          }', '  }').replace('          async', '  async')
          helper_replacement = '''    await Promise.all(parallelPromises)
          }

          private async hookParallelAndCollectErrors<
            H extends AsyncPluginHooks & ParallelPluginHooks,
          >(
            hookName: H,
            context: (plugin: Plugin) => ThisType<FunctionPluginHooks[H]>,
            args: (plugin: Plugin) => Parameters<FunctionPluginHooks[H]>,
            condition?: (plugin: Plugin) => boolean | undefined,
          ): Promise<unknown[]> {
            const errors: Array<{ hookIndex: number; error: unknown }> = []
            const parallelPromises: Promise<void>[] = []
            let hookIndex = 0

            const runHook = async (plugin: Plugin, currentHookIndex: number) => {
              try {
                const hook = plugin[hookName]!
                const handler: Function = getHookHandler(hook)
                await handler.apply(context(plugin), args(plugin))
              } catch (error) {
                errors.push({ hookIndex: currentHookIndex, error })
              }
            }

            for (const plugin of this.getSortedPlugins(hookName)) {
              if (condition && !condition(plugin)) continue

              const currentHookIndex = hookIndex++
              const hook = plugin[hookName]!
              if ((hook as { sequential?: boolean }).sequential) {
                await Promise.all(parallelPromises)
                parallelPromises.length = 0
                await runHook(plugin, currentHookIndex)
              } else {
                parallelPromises.push(runHook(plugin, currentHookIndex))
              }
            }
            await Promise.all(parallelPromises)

            return errors
              .sort((left, right) => left.hookIndex - right.hookIndex)
              .map(({ error }) => error)
          }

          async buildStart(_options?: InputOptions): Promise<void> {
          '''.replace('          }', '  }').replace('          private', '  private').replace('          async', '  async')
          if text.count(helper_anchor) != 1:
              raise SystemExit(f'expected one helper anchor, found {text.count(helper_anchor)}')
          text = text.replace(helper_anchor, helper_replacement, 1)

          close_block = '''    const config = this.environment.getTopLevelConfig()
          let buildEndFailed = false
          let buildEndError: unknown
          try {
            await this.hookParallel(
              'buildEnd',
              (plugin) => this._getPluginContext(plugin),
              () => [],
              (plugin) =>
                this.environment.name === 'client' ||
                config.server.perEnvironmentStartEndDuringDev ||
                plugin.perEnvironmentStartEndDuringDev,
            )
          } catch (error) {
            buildEndFailed = true
            buildEndError = error
          }

          try {
            await this.hookParallel(
              'closeBundle',
              (plugin) => this._getPluginContext(plugin),
              () => [],
            )
          } catch (closeBundleError) {
            if (buildEndFailed) {
              throw new AggregateError(
                [buildEndError, closeBundleError],
                'buildEnd and closeBundle hooks failed',
              )
            }
            throw closeBundleError
          }

          if (buildEndFailed) {
            throw buildEndError
          }
          '''
          close_replacement = '''    const config = this.environment.getTopLevelConfig()
          const errors = [
            ...(await this.hookParallelAndCollectErrors(
              'buildEnd',
              (plugin) => this._getPluginContext(plugin),
              () => [],
              (plugin) =>
                this.environment.name === 'client' ||
                config.server.perEnvironmentStartEndDuringDev ||
                plugin.perEnvironmentStartEndDuringDev,
            )),
            ...(await this.hookParallelAndCollectErrors(
              'closeBundle',
              (plugin) => this._getPluginContext(plugin),
              () => [],
            )),
          ]

          if (errors.length === 1) {
            throw errors[0]
          }
          if (errors.length > 1) {
            throw new AggregateError(errors, 'buildEnd or closeBundle hooks failed')
          }
          '''
          if text.count(close_block) != 1:
              raise SystemExit(f'expected one close block, found {text.count(close_block)}')
          path.write_text(text.replace(close_block, close_replacement, 1))
          PY

      - name: Format, build, and run focused controls
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec oxfmt packages/vite/src/node/server/pluginContainer.ts packages/vite/src/node/server/__tests__/pluginContainer-close.spec.ts
          pnpm --filter vite build
          pnpm test-unit packages/vite/src/node/server/__tests__/pluginContainer-close.spec.ts

      - name: Run static and hygiene gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter vite typecheck
          pnpm exec eslint --no-cache --concurrency auto packages/vite/src/node/server/pluginContainer.ts packages/vite/src/node/server/__tests__/pluginContainer-close.spec.ts
          pnpm exec oxfmt --check packages/vite/src/node/server/pluginContainer.ts packages/vite/src/node/server/__tests__/pluginContainer-close.spec.ts
          git diff --check
          test "$(git status --short | cut -c4- | sort)" = $'packages/vite/src/node/server/__tests__/pluginContainer-close.spec.ts\npackages/vite/src/node/server/pluginContainer.ts'

      - name: Publish corrected exact two-file source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin repair/dev-closebundle-after-buildend-failure
          test "$(git rev-parse FETCH_HEAD)" = "ef590b56365742d25a363af21b0a35580c62708d"
          git config user.name fieldwork-repair-bot
          git config user.email fieldwork-repair-bot@users.noreply.github.com
          git add packages/vite/src/node/server/pluginContainer.ts packages/vite/src/node/server/__tests__/pluginContainer-close.spec.ts
          test "$(git diff --cached --name-only | sort)" = $'packages/vite/src/node/server/__tests__/pluginContainer-close.spec.ts\npackages/vite/src/node/server/pluginContainer.ts'
          git commit -m "fix(dev): settle close lifecycle hooks before cleanup"
          git push origin HEAD:repair/dev-closebundle-after-buildend-failure
