name: Fieldwork watchChange isolation fix

permissions:
  contents: write

on:
  push:
    branches:
      - fix/fieldwork-25-watchchange-error-isolation
    paths:
      - .github/workflows/fieldwork-watchchange-isolation-fix.yml

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Apply narrow source and regression changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('packages/vite/src/node/server/index.ts')
          source = source_path.read_text()

          anchor = """  const onFileAddUnlink = async (file: string, isUnlink: boolean) => {
"""
          helper = """  const notifyWatchChange = async (
    file: string,
    event: 'create' | 'update' | 'delete',
  ) => {
    const results = await Promise.allSettled(
      Object.values(server.environments).map((environment) =>
        environment.pluginContainer.watchChange(file, { event }),
      ),
    )
    for (const result of results) {
      if (result.status === 'rejected') {
        server.config.logger.error(result.reason)
      }
    }
  }

  const onFileAddUnlink = async (file: string, isUnlink: boolean) => {
"""
          if source.count(anchor) != 1:
              raise SystemExit('onFileAddUnlink anchor changed')
          source = source.replace(anchor, helper, 1)

          add_unlink = """    await Promise.all(
      Object.values(server.environments).map((environment) =>
        environment.pluginContainer.watchChange(file, {
          event: isUnlink ? 'delete' : 'create',
        }),
      ),
    )
"""
          add_unlink_replacement = """    await notifyWatchChange(file, isUnlink ? 'delete' : 'create')
"""
          if source.count(add_unlink) != 1:
              raise SystemExit('add/unlink watchChange block changed')
          source = source.replace(add_unlink, add_unlink_replacement, 1)

          change = """    await Promise.all(
      Object.values(server.environments).map((environment) =>
        environment.pluginContainer.watchChange(file, { event: 'update' }),
      ),
    )
"""
          change_replacement = """    await notifyWatchChange(file, 'update')
"""
          if source.count(change) != 1:
              raise SystemExit('change watchChange block changed')
          source = source.replace(change, change_replacement, 1)
          source_path.write_text(source)

          test_path = Path(
              'packages/vite/src/node/__tests__/server/watchChange-error-isolation.spec.js'
          )
          test_path.write_text("""import { mkdtemp, mkdir, readFile, rm, writeFile } from 'node:fs/promises'
import os from 'node:os'
import path from 'node:path'
import { expect, onTestFinished, test } from 'vitest'
import { createLogger } from '../../logger'
import { createServer } from '../../server'

test('watchChange errors do not prevent invalidation or HMR', async () => {
  const root = await mkdtemp(path.join(os.tmpdir(), 'vite-watch-change-'))
  onTestFinished(() => rm(root, { recursive: true, force: true }))

  const stateFile = path.join(root, 'state.txt')
  const virtualId = '\\0virtual:watch-change-state'
  const virtualRequestId = 'virtual:watch-change-state'
  const watchChangeError = new Error('watchChange rejection')

  await writeProject(root, {
    'index.html': '<script type="module" src="/src/main.js"></script>',
    'src/main.js': [
      "import { value } from 'virtual:watch-change-state'",
      'console.log(value)',
      "if (import.meta.hot) import.meta.hot.accept('virtual:watch-change-state', () => {})",
    ].join('\\n'),
    'state.txt': 'alpha\\n',
  })

  const loggedError = promiseWithResolvers()
  const hotUpdateCalled = promiseWithResolvers()
  const logger = createLogger('silent')
  logger.error = (error) => {
    expect(error).toBe(watchChangeError)
    loggedError.resolve()
  }

  const server = await createServer({
    root,
    configFile: false,
    logLevel: 'silent',
    customLogger: logger,
    plugins: [
      {
        name: 'watch-change-state',
        resolveId(id) {
          if (id === virtualRequestId) return virtualId
        },
        async load(id) {
          if (id !== virtualId) return
          this.addWatchFile(stateFile)
          const value = (await readFile(stateFile, 'utf8')).trim()
          return `export const value = ${JSON.stringify(value)}`
        },
        watchChange(id) {
          if (path.resolve(id) === stateFile) throw watchChangeError
        },
        hotUpdate({ file }) {
          if (path.resolve(file) === stateFile) {
            hotUpdateCalled.resolve()
            return []
          }
        },
      },
    ],
    server: { middlewareMode: true, ws: false },
  })
  onTestFinished(() => server.close())

  await server.transformRequest('/src/main.js')
  const first = await server.transformRequest(virtualRequestId)
  expect(first?.code).toContain('alpha')

  const mod = server.environments.client.moduleGraph.getModuleById(virtualId)
  expect(mod?.transformResult).toBeTruthy()

  await writeFile(stateFile, 'beta\\n')
  server.watcher.emit('change', stateFile)

  await withTimeout(loggedError.promise, 'watchChange error was not logged')
  await withTimeout(hotUpdateCalled.promise, 'hotUpdate hook was not reached')
  await waitUntil(() => mod.transformResult == null, 'module was not invalidated')

  const refreshed = await server.transformRequest(virtualRequestId)
  expect(refreshed?.code).toContain('beta')
})

async function writeProject(root, files) {
  for (const [relativePath, content] of Object.entries(files)) {
    const filename = path.join(root, relativePath)
    await mkdir(path.dirname(filename), { recursive: true })
    await writeFile(filename, content)
  }
}

async function waitUntil(predicate, message) {
  const deadline = Date.now() + 2_000
  while (Date.now() < deadline) {
    if (predicate()) return
    await new Promise((resolve) => setTimeout(resolve, 10))
  }
  throw new Error(message)
}

async function withTimeout(promise, message) {
  let timer
  try {
    return await Promise.race([
      promise,
      new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error(message)), 2_000)
      }),
    ])
  } finally {
    clearTimeout(timer)
  }
}

function promiseWithResolvers() {
  let resolve
  let reject
  const promise = new Promise((_resolve, _reject) => {
    resolve = _resolve
    reject = _reject
  })
  return { promise, resolve, reject }
}
""")
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: pnpm exec oxfmt packages/vite/src/node/server/index.ts packages/vite/src/node/__tests__/server/watchChange-error-isolation.spec.js

      - name: Build Vite
        run: pnpm run build

      - name: Run focused regression
        run: pnpm exec vitest run packages/vite/src/node/__tests__/server/watchChange-error-isolation.spec.js

      - name: Lint changed files
        run: pnpm exec eslint packages/vite/src/node/server/index.ts packages/vite/src/node/__tests__/server/watchChange-error-isolation.spec.js

      - name: Commit validated source and remove bootstrap
        run: |
          rm .github/workflows/fieldwork-watchchange-isolation-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/vite/src/node/server/index.ts packages/vite/src/node/__tests__/server/watchChange-error-isolation.spec.js .github/workflows/fieldwork-watchchange-isolation-fix.yml
          git commit -m "fix(dev): isolate watchChange errors from invalidation"
          git push
