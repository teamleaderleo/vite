name: Fieldwork watchChange isolation fix

permissions:
  contents: write

on:
  push:
    branches:
      - fix/fieldwork-25-watchchange-error-isolation
    paths:
      - .github/workflows/fieldwork-watchchange-isolation-fix.yml

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply guarded server patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/vite/src/node/server/index.ts')
          source = path.read_text()

          anchor = "  const onFileAddUnlink = async (file: string, isUnlink: boolean) => {\n"
          helper = (
              "  const notifyWatchChange = async (\n"
              "    file: string,\n"
              "    event: 'create' | 'update' | 'delete',\n"
              "  ) => {\n"
              "    const results = await Promise.allSettled(\n"
              "      Object.values(server.environments).map((environment) =>\n"
              "        environment.pluginContainer.watchChange(file, { event }),\n"
              "      ),\n"
              "    )\n"
              "    for (const result of results) {\n"
              "      if (result.status === 'rejected') {\n"
              "        server.config.logger.error(result.reason)\n"
              "      }\n"
              "    }\n"
              "  }\n\n"
              + anchor
          )
          if source.count(anchor) != 1:
              raise SystemExit('onFileAddUnlink anchor changed')
          source = source.replace(anchor, helper, 1)

          add_unlink = (
              "    await Promise.all(\n"
              "      Object.values(server.environments).map((environment) =>\n"
              "        environment.pluginContainer.watchChange(file, {\n"
              "          event: isUnlink ? 'delete' : 'create',\n"
              "        }),\n"
              "      ),\n"
              "    )\n"
          )
          if source.count(add_unlink) != 1:
              raise SystemExit('add/unlink watchChange block changed')
          source = source.replace(
              add_unlink,
              "    await notifyWatchChange(file, isUnlink ? 'delete' : 'create')\n",
              1,
          )

          change = (
              "    await Promise.all(\n"
              "      Object.values(server.environments).map((environment) =>\n"
              "        environment.pluginContainer.watchChange(file, { event: 'update' }),\n"
              "      ),\n"
              "    )\n"
          )
          if source.count(change) != 1:
              raise SystemExit('change watchChange block changed')
          source = source.replace(
              change,
              "    await notifyWatchChange(file, 'update')\n",
              1,
          )

          path.write_text(source)
          PY

      - name: Format changed files
        run: pnpm exec oxfmt packages/vite/src/node/server/index.ts packages/vite/src/node/__tests__/server/watchChange-error-isolation.spec.js

      - name: Build Vite
        run: pnpm run build

      - name: Run focused regression
        run: pnpm exec vitest run packages/vite/src/node/__tests__/server/watchChange-error-isolation.spec.js

      - name: Lint changed files
        run: pnpm exec eslint packages/vite/src/node/server/index.ts packages/vite/src/node/__tests__/server/watchChange-error-isolation.spec.js

      - name: Commit validated source
        run: |
          rm -f .github/workflows/fieldwork-watchchange-isolation-fix.yml
          rm -f .github/workflows/fieldwork-watchchange-isolation-trigger.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/vite/src/node/server/index.ts packages/vite/src/node/__tests__/server/watchChange-error-isolation.spec.js .github/workflows
          git commit -m "fix(dev): isolate watchChange errors from invalidation"
          git push
