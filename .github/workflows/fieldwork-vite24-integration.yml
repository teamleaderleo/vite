name: Fieldwork Vite 24 integration

permissions: {}

on:
  push:
    branches:
      - fieldwork/662-dep-cache-integrated-validation

jobs:
  optimizer-integration:
    name: "#24 + #31 + #32 optimizer integration (macOS)"
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Run integrated optimizer regressions
        run: >-
          pnpm test-unit
          packages/vite/src/node/__tests__/optimizer/sharedCacheDir.spec.ts
          packages/vite/src/node/__tests__/optimizer/restartPreListenCacheDir.spec.ts
          packages/vite/src/node/__tests__/configResolveIdempotence.spec.ts
          packages/vite/src/node/__tests__/optimizer/preInitWarmCache.spec.ts
