name: Research Config Build E2E Stress Candidate

permissions: {}

env:
  NODE_OPTIONS: --max-old-space-size=6144
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  VITEST_SEGFAULT_RETRY: 3

on:
  push:
    branches:
      - research/config-build-e2e-stress-candidate
  workflow_dispatch:

jobs:
  stress-build-e2e:
    name: Candidate build E2E x6 / node-${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install deps
        run: pnpm install

      - name: Set Playwright path and version
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/playwright-bin" >> "$GITHUB_ENV"
          PLAYWRIGHT_VERSION="$(pnpm ls --depth 0 --json -w playwright-chromium | jq --raw-output '.[0].devDependencies["playwright-chromium"].version')"
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> "$GITHUB_ENV"

      - name: Cache Playwright binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: ${{ runner.os }}-playwright-bin-v1-${{ env.PLAYWRIGHT_VERSION }}
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          restore-keys: |
            ${{ runner.os }}-playwright-bin-v1-

      - name: Install Playwright
        run: pnpm playwright install chromium

      - name: Build
        run: pnpm run build

      - name: Run build E2E six times
        shell: bash
        run: |
          failures=0
          for iteration in $(seq 1 6); do
            echo "::group::build-e2e iteration ${iteration}"
            if pnpm run test-build; then
              echo "iteration ${iteration}: passed"
            else
              echo "iteration ${iteration}: failed"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done
          echo "BUILD_E2E_FAILURES=${failures}"
          test "${failures}" -eq 0
