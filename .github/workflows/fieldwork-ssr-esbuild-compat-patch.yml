name: Fieldwork SSR optimizer compat patch

on:
  push:
    branches:
      - fix/fieldwork-662-ssr-esbuild-plugin-compat

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/fieldwork-662-ssr-esbuild-plugin-compat
          fetch-depth: 2

      - name: Apply exact compatibility helper patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/vite/src/node/config.ts')
          text = path.read_text()
          old = '''function applyDepOptimizationOptionCompat(resolvedConfig: ResolvedConfig) {
            if (
              resolvedConfig.optimizeDeps.esbuildOptions?.plugins &&
              resolvedConfig.optimizeDeps.esbuildOptions.plugins.length > 0
            ) {
              resolvedConfig.optimizeDeps.rolldownOptions ??= {}
              resolvedConfig.optimizeDeps.rolldownOptions.plugins ||= []
              ;(resolvedConfig.optimizeDeps.rolldownOptions.plugins as any[]).push(
                ...resolvedConfig.optimizeDeps.esbuildOptions.plugins.map((plugin) =>
                  convertEsbuildPluginToRolldownPlugin(plugin),
                ),
              )
            }
          }
          '''
          new = '''function applyDepOptimizationOptionCompat(resolvedConfig: ResolvedConfig) {
            for (const environment of Object.values(resolvedConfig.environments)) {
              const optimizeDeps = environment.optimizeDeps
              if (
                optimizeDeps.esbuildOptions?.plugins &&
                optimizeDeps.esbuildOptions.plugins.length > 0
              ) {
                optimizeDeps.rolldownOptions ??= {}
                optimizeDeps.rolldownOptions.plugins ||= []
                ;(optimizeDeps.rolldownOptions.plugins as any[]).push(
                  ...optimizeDeps.esbuildOptions.plugins.map((plugin) =>
                    convertEsbuildPluginToRolldownPlugin(plugin),
                  ),
                )
              }
            }
          }
          '''

          if old in text:
            path.write_text(text.replace(old, new, 1))
          elif new not in text:
            raise SystemExit('expected compatibility helper not found')
          PY

          if git diff --quiet -- packages/vite/src/node/config.ts; then
            exit 0
          fi

          git diff --check -- packages/vite/src/node/config.ts
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git add packages/vite/src/node/config.ts
          git commit -m "fix(config): convert optimizer esbuild plugins per environment"
          git push origin HEAD:fix/fieldwork-662-ssr-esbuild-plugin-compat
