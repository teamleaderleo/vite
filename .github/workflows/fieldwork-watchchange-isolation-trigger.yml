name: Trigger Fieldwork watchChange fix

# Second branch commit activates this already-registered workflow.

permissions:
  contents: write

on:
  push:
    branches:
      - fix/fieldwork-25-watchchange-error-isolation
    paths:
      - .github/workflows/fieldwork-watchchange-isolation-trigger.yml

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Trigger existing branch workflow
        run: |
          printf '\n# Triggered after workflow registration.\n' >> .github/workflows/fieldwork-watchchange-isolation-fix.yml
          rm .github/workflows/fieldwork-watchchange-isolation-trigger.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/fieldwork-watchchange-isolation-fix.yml .github/workflows/fieldwork-watchchange-isolation-trigger.yml
          git commit -m "ci: trigger watchChange fix workflow"
          git push
