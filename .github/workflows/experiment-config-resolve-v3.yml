name: Experiment config resolve ownership v3

on:
  push:
    branches:
      - experiment/config-resolve-input-ownership-v3-runner

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: experiment/config-resolve-input-ownership-v3-runner
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile

      - name: Apply candidate
        run: python .github/scripts/apply-config-resolve-v3.py

      - name: Format candidate
        run: pnpm exec oxfmt --write packages/vite/src/node/configClone.ts packages/vite/src/node/config.ts packages/vite/src/node/__tests__/configResolveOwnershipV3.spec.ts

      - name: Lint candidate
        run: pnpm exec eslint packages/vite/src/node/configClone.ts packages/vite/src/node/config.ts packages/vite/src/node/__tests__/configResolveOwnershipV3.spec.ts

      - name: Build repository packages
        run: pnpm run build

      - name: Typecheck Vite
        run: pnpm --filter vite typecheck

      - name: Run focused tests
        run: pnpm test-unit packages/vite/src/node/__tests__/config.spec.ts packages/vite/src/node/__tests__/configResolveOwnershipV3.spec.ts packages/vite/src/node/__tests__/plugins/terser.spec.ts

      - name: Commit candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/vite/src/node/configClone.ts packages/vite/src/node/config.ts packages/vite/src/node/__tests__/configResolveOwnershipV3.spec.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit --no-verify -m "experiment: refine config resolve ownership boundary"
          git push origin HEAD:experiment/config-resolve-input-ownership-v3-runner
