name: Config resolve ownership style amend

on:
  push:
    branches:
      - experiment/config-resolve-input-ownership-style-amend-ci

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: review/config-resolve-input-ownership-final
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile
      - name: Apply local copy-before-delete cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/vite/src/node/config.ts')
          text = path.read_text()
          old = """  const hasRollupOptionCompatProxy =
            !!optimizeDeps?.rolldownOptions &&
            optimizeDeps.rolldownOptions === optimizeDeps.rollupOptions
          const merged = mergeWithDefaults(
            {
              ...configDefaults.optimizeDeps,
              disabled: undefined, // do not set here to avoid deprecation warning
              noDiscovery: consumer !== 'client',
              force: forceOptimizeDeps ?? configDefaults.optimizeDeps.force,
            },
            optimizeDeps ?? {},
          )
          if (hasRollupOptionCompatProxy) {
            merged.rollupOptions = merged.rolldownOptions
          }
          """
          new = """  let optimizeDepsForMerge = optimizeDeps
          if (
            optimizeDeps?.rolldownOptions &&
            optimizeDeps.rolldownOptions === optimizeDeps.rollupOptions
          ) {
            optimizeDepsForMerge = { ...optimizeDeps }
            delete optimizeDepsForMerge.rollupOptions
          }
          const merged = mergeWithDefaults(
            {
              ...configDefaults.optimizeDeps,
              disabled: undefined, // do not set here to avoid deprecation warning
              noDiscovery: consumer !== 'client',
              force: forceOptimizeDeps ?? configDefaults.optimizeDeps.force,
            },
            optimizeDepsForMerge ?? {},
          )
          """
          if text.count(old) != 1:
            raise SystemExit(f'expected one optimizer compat block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm exec oxfmt --write packages/vite/src/node/config.ts
      - run: pnpm exec eslint packages/vite/src/node/config.ts
      - run: pnpm run build
      - run: pnpm --filter vite typecheck
      - run: pnpm test-unit packages/vite/src/node/__tests__/config.spec.ts packages/vite/src/node/__tests__/configResolveInputOwnership.spec.ts packages/vite/src/node/__tests__/plugins/terser.spec.ts
      - name: Amend clean candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/vite/src/node/config.ts
          git commit --amend --no-edit --no-verify
          git push --force-with-lease origin HEAD:review/config-resolve-input-ownership-final
