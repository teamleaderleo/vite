name: Research Config Service Identity

permissions: {}

env:
  NODE_OPTIONS: --max-old-space-size=6144
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

on:
  push:
    branches:
      - research/config-clone-service-identity
  workflow_dispatch:

jobs:
  focused:
    name: Config clone service identity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Run config ownership tests
        run: >-
          pnpm exec vitest run
          packages/vite/src/node/__tests__/configClone.spec.ts
          packages/vite/src/node/__tests__/configResolveInputOwnership.spec.ts
          packages/vite/src/node/__tests__/config.spec.ts

      - name: Check changed source formatting
        shell: bash
        run: |
          files=(
            packages/vite/src/node/configClone.ts
            packages/vite/src/node/__tests__/configClone.spec.ts
            packages/vite/src/node/__tests__/configResolveInputOwnership.spec.ts
          )
          pnpm exec oxfmt "${files[@]}"
          git diff --check
          git diff --exit-code -- "${files[@]}"
