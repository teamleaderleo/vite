name: CI

env:
  NODE_OPTIONS: --max-old-space-size=4096

permissions: {}

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  fieldwork-unit-01-repair:
    if: github.head_ref == 'fix/fieldwork-25-watchchange-error-isolation'
    permissions:
      contents: write
    runs-on: ubuntu-slim
    timeout-minutes: 45
    name: Fieldwork Unit 01 source repair
    steps:
      - name: Checkout canonical source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/fieldwork-25-watchchange-error-isolation
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set node version to 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Apply deterministic source repair
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          container = Path('packages/vite/src/node/server/pluginContainer.ts')
          text = container.read_text()

          helper = indent(
            dedent('''\
          private async hookParallelWithErrorHandler<
            H extends AsyncPluginHooks & ParallelPluginHooks,
          >(
            hookName: H,
            context: (plugin: Plugin) => ThisType<FunctionPluginHooks[H]>,
            args: (plugin: Plugin) => Parameters<FunctionPluginHooks[H]>,
            onError: (error: Parameters<Logger['error']>[0]) => void,
            condition?: (plugin: Plugin) => boolean | undefined,
          ): Promise<void> {
            const parallelPromises: Promise<void>[] = []
            const runHook = async (plugin: Plugin) => {
              const hook = plugin[hookName]
              const handler: Function = getHookHandler(hook)
              try {
                await this.handleHookPromise(
                  handler.apply(context(plugin), args(plugin)),
                )
              } catch (error) {
                onError(error as Parameters<Logger['error']>[0])
              }
            }

            for (const plugin of this.getSortedPlugins(hookName)) {
              if (condition && !condition(plugin)) continue

              const hook = plugin[hookName]
              if ((hook as { sequential?: boolean }).sequential) {
                await Promise.all(parallelPromises)
                parallelPromises.length = 0
                await runHook(plugin)
              } else {
                parallelPromises.push(runHook(plugin))
              }
            }
            await Promise.all(parallelPromises)
          }

          '''),
            '  ',
          )
          marker = '  async buildStart(_options?: InputOptions): Promise<void> {\n'
          if 'hookParallelWithErrorHandler' not in text:
            text = text.replace(marker, helper + marker, 1)

          class_start = text.index('class EnvironmentPluginContainer')
          method_start = text.index('  async watchChange(\n', class_start)
          method_end = text.index('\n  async close(): Promise<void> {', method_start)
          method = indent(
            dedent('''\
          async watchChange(
            id: string,
            change: { event: 'create' | 'update' | 'delete' },
            onError?: (error: Parameters<Logger['error']>[0]) => void,
          ): Promise<void> {
            const config = this.environment.getTopLevelConfig()
            const condition = (plugin: Plugin) =>
              this.environment.name === 'client' ||
              config.server.perEnvironmentWatchChangeDuringDev ||
              plugin.perEnvironmentWatchChangeDuringDev

            if (onError) {
              await this.hookParallelWithErrorHandler(
                'watchChange',
                (plugin) => this._getPluginContext(plugin),
                () => [id, change],
                onError,
                condition,
              )
            } else {
              await this.hookParallel(
                'watchChange',
                (plugin) => this._getPluginContext(plugin),
                () => [id, change],
                condition,
              )
            }
          }
          '''),
            '  ',
          ).rstrip()
          text = text[:method_start] + method + text[method_end:]
          container.write_text(text)

          server = Path('packages/vite/src/node/server/index.ts')
          text = server.read_text()
          old = '        environment.pluginContainer.watchChange(file, { event }),\n'
          new = (
            '        environment.pluginContainer.watchChange(\n'
            '          file,\n'
            '          { event },\n'
            '          (error) => server.config.logger.error(error),\n'
            '        ),\n'
          )
          if old not in text:
            raise SystemExit('server watchChange call marker not found')
          server.write_text(text.replace(old, new, 1))
          PY

      - name: Add adversarial controls
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          lines = Path(
            '.github/workflows/fieldwork-watchchange-plugin-settlement.yml'
          ).read_text().splitlines()
          start = lines.index('      - name: Add adversarial controls')
          run = next(
            index for index in range(start + 1, len(lines))
            if lines[index] == '        run: |'
          )
          body = []
          for line in lines[run + 1:]:
            if line.startswith('      - name: '):
              break
            body.append(line[10:] if line.startswith('          ') else line)
          subprocess.run(
            '\n'.join(body) + '\n',
            shell=True,
            check=True,
            executable='/bin/bash',
          )
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed source
        run: |
          pnpm exec oxfmt --write \
            packages/vite/src/node/server/index.ts \
            packages/vite/src/node/server/pluginContainer.ts \
            packages/vite/src/node/__tests__/server/watchChange-error-isolation.spec.js

      - name: Build Vite
        run: pnpm run build

      - name: Run focused watchChange tests
        run: pnpm exec vitest run packages/vite/src/node/__tests__/server/watchChange-error-isolation.spec.js

      - name: Lint changed source
        run: |
          pnpm exec eslint \
            packages/vite/src/node/server/index.ts \
            packages/vite/src/node/server/pluginContainer.ts \
            packages/vite/src/node/__tests__/server/watchChange-error-isolation.spec.js

      - name: Commit clean repaired source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout e6b6b167afa0a80548829d1f24a0712f9194389a -- .github/workflows/ci.yml
          rm .github/workflows/fieldwork-watchchange-plugin-settlement.yml
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git add \
            packages/vite/src/node/server/index.ts \
            packages/vite/src/node/server/pluginContainer.ts \
            packages/vite/src/node/__tests__/server/watchChange-error-isolation.spec.js \
            .github/workflows/ci.yml \
            .github/workflows/fieldwork-watchchange-plugin-settlement.yml
          git commit -m "fix(dev): settle watchChange hooks before invalidation"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/fieldwork-25-watchchange-error-isolation
