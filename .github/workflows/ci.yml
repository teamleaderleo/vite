name: CI

env:
  NODE_OPTIONS: --max-old-space-size=4096

permissions: {}

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  fieldwork-unit-01-api-boundary:
    if: github.head_ref == 'fix/fieldwork-25-watchchange-error-isolation'
    permissions:
      contents: write
    runs-on: ubuntu-slim
    timeout-minutes: 45
    name: Fieldwork Unit 01 API boundary
    steps:
      - name: Checkout canonical source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/fieldwork-25-watchchange-error-isolation
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set node version to 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Move callback behind stripped internal method
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          container = Path('packages/vite/src/node/server/pluginContainer.ts')
          text = container.read_text()
          class_start = text.index('class EnvironmentPluginContainer')
          method_start = text.index('  async watchChange(\n', class_start)
          method_end = text.index('\n  async close(): Promise<void> {', method_start)
          methods = indent(
            dedent('''\
          private shouldRunWatchChange(plugin: Plugin): boolean {
            const config = this.environment.getTopLevelConfig()
            return (
              this.environment.name === 'client' ||
              config.server.perEnvironmentWatchChangeDuringDev ||
              plugin.perEnvironmentWatchChangeDuringDev
            )
          }

          async watchChange(
            id: string,
            change: { event: 'create' | 'update' | 'delete' },
          ): Promise<void> {
            await this.hookParallel(
              'watchChange',
              (plugin) => this._getPluginContext(plugin),
              () => [id, change],
              (plugin) => this.shouldRunWatchChange(plugin),
            )
          }

          /** @internal */
          async watchChangeWithErrorHandler(
            id: string,
            change: { event: 'create' | 'update' | 'delete' },
            onError: (error: Parameters<Logger['error']>[0]) => void,
          ): Promise<void> {
            await this.hookParallelWithErrorHandler(
              'watchChange',
              (plugin) => this._getPluginContext(plugin),
              () => [id, change],
              onError,
              (plugin) => this.shouldRunWatchChange(plugin),
            )
          }
          '''),
            '  ',
          ).rstrip()
          container.write_text(text[:method_start] + methods + text[method_end:])

          server = Path('packages/vite/src/node/server/index.ts')
          text = server.read_text()
          old = 'environment.pluginContainer.watchChange('
          new = 'environment.pluginContainer.watchChangeWithErrorHandler('
          if old not in text:
            raise SystemExit('watcher callback call not found')
          server.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format source
        run: |
          pnpm exec oxfmt --write \
            packages/vite/src/node/server/index.ts \
            packages/vite/src/node/server/pluginContainer.ts

      - name: Build Vite
        run: pnpm run build

      - name: Verify internal method is absent from declarations
        run: |
          if find packages/vite/dist -name '*.d.ts' -print0 | xargs -0 grep -n 'watchChangeWithErrorHandler'; then
            echo 'internal watchChange method leaked into generated declarations' >&2
            exit 1
          fi

      - name: Run focused watchChange tests
        run: pnpm exec vitest run packages/vite/src/node/__tests__/server/watchChange-error-isolation.spec.js

      - name: Lint changed source and tests
        run: |
          pnpm exec eslint \
            packages/vite/src/node/server/index.ts \
            packages/vite/src/node/server/pluginContainer.ts \
            packages/vite/src/node/__tests__/server/watchChange-error-isolation.spec.js

      - name: Commit clean internal-boundary refinement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout e6b6b167afa0a80548829d1f24a0712f9194389a -- .github/workflows/ci.yml
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git add \
            packages/vite/src/node/server/index.ts \
            packages/vite/src/node/server/pluginContainer.ts \
            .github/workflows/ci.yml
          git commit -m "refactor(dev): keep watchChange settlement internal"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/fieldwork-25-watchchange-error-isolation
