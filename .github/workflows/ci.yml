name: CI

env:
  # 7 GiB by default on GitHub, setting to 6 GiB
  # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
  NODE_OPTIONS: --max-old-space-size=6144
  # install playwright binary manually (because pnpm only runs install script once)
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  # Vitest auto retry on flaky segfault
  VITEST_SEGFAULT_RETRY: 3

# Remove default permissions of GITHUB_TOKEN for security
# https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
permissions: {}

on:
  push:
    branches:
      - main
      - release/*
      - feat/*
      - fix/*
      - perf/*
      - "v[0-9]+" # v1, v2, ...
      - "v[0-9]+.[0-9]+" # v4.0, v4.1, ...
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  changed:
    name: Get changed files
    runs-on: ubuntu-slim
    outputs:
      should_skip: ${{ steps.changed-files.outputs.only_changed == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Assume PRs are less than 50 commits
          fetch-depth: 50
          persist-credentials: false

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            docs/**
            .github/**
            !.github/workflows/ci.yml
            packages/create-vite/template**
            **.md

  test:
    needs: changed
    if: needs.changed.outputs.should_skip != 'true'
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node_version: [20, 22, 24, 26]
        include:
          # Active LTS + other OS
          - os: macos-latest
            node_version: 24
          - os: windows-latest
            # use older minor to workaround https://github.com/nodejs/node/issues/63638
            node_version: 24.15.0
      fail-fast: false

    name: "Build&Test: node-${{ matrix.node_version }}, ${{ matrix.os }}"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - if: matrix.node_version != '20'
        name: Set node version to ${{ matrix.node_version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node_version }}
          cache: "pnpm"
      - if: matrix.node_version == '20' # use node 24 for builds
        name: Set node version to 24 for builds
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install deps
        run: pnpm install

      # Install playwright's binary under custom directory to cache
      - name: (non-windows) Set Playwright path and Get playwright version
        if: runner.os != 'Windows'
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/playwright-bin" >> $GITHUB_ENV
          PLAYWRIGHT_VERSION="$(pnpm ls --depth 0 --json -w playwright-chromium | jq --raw-output '.[0].devDependencies["playwright-chromium"].version')"
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV
      - name: (windows) Set Playwright path and Get playwright version
        if: runner.os == 'Windows'
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME\.cache\playwright-bin" >> $env:GITHUB_ENV
          $env:PLAYWRIGHT_VERSION="$(pnpm ls --depth 0 --json -w playwright-chromium | jq --raw-output '.[0].devDependencies["playwright-chromium"].version')"
          echo "PLAYWRIGHT_VERSION=$env:PLAYWRIGHT_VERSION" >> $env:GITHUB_ENV

      - name: Cache Playwright's binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: ${{ runner.os }}-playwright-bin-v1-${{ env.PLAYWRIGHT_VERSION }}
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          restore-keys: |
            ${{ runner.os }}-playwright-bin-v1-

      - name: Install Playwright
        # does not need to explicitly set chromium after https://github.com/microsoft/playwright/issues/14862 is solved
        run: pnpm playwright install chromium

      - name: Build
        run: pnpm run build

      - if: matrix.node_version == '20'
        name: Set node version to ${{ matrix.node_version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node_version }}
          cache: "pnpm"

      - name: Test unit
        run: pnpm run test-unit

      - name: Test serve
        run: pnpm run test-serve

      - name: Test serve (bundled dev)
        run: pnpm run test-serve-bundled

      - name: Test build
        run: pnpm run test-build

  test-passed:
    if: (!cancelled() && !failure())
    needs: test
    runs-on: ubuntu-slim
    name: Build & Test Passed or Skipped
    steps:
      - run: echo "Build & Test Passed or Skipped"

  test-failed:
    if: (!cancelled() && failure())
    needs: test
    runs-on: ubuntu-slim
    name: Build & Test Failed
    steps:
      - run: echo "Build & Test Failed"

  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: "Lint: node-24, ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set node version to 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install deps
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm format && git diff --exit-code

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test docs
        run: pnpm run test-docs

      # From https://github.com/rhysd/actionlint/blob/main/docs/usage.md#use-actionlint-on-github-actions
      - name: Check workflow files
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color -shellcheck=""

  fieldwork-construction-cleanup:
    name: Fieldwork construction cleanup
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set node version to 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install deps
        run: pnpm install

      - name: Apply construction cleanup candidate
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('packages/vite/src/node/server/index.ts')
          source = path.read_text()

          old_init = '''  const environments: Record<string, DevEnvironment> = {}

          await Promise.all(
            Object.entries(config.environments).map(
              async ([name, environmentOptions]) => {
                const environment = await environmentOptions.dev.createEnvironment(
                  name,
                  config,
                  {
                    ws,
                  },
                )
                environments[name] = environment

                const previousInstance =
                  options.previousEnvironments?.[environment.name]
                await environment.init({ watcher, previousInstance })
              },
            ),
          )
          '''
          old_init = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_init.splitlines()) + '\n'
          new_init = '''  const closeHttpServer = createServerCloseFn(httpServer)
          const environments: Record<string, DevEnvironment> = {}

          try {
            await Promise.all(
              Object.entries(config.environments).map(
                async ([name, environmentOptions]) => {
                  const environment = await environmentOptions.dev.createEnvironment(
                    name,
                    config,
                    {
                      ws,
                    },
                  )
                  environments[name] = environment

                  const previousInstance =
                    options.previousEnvironments?.[environment.name]
                  await environment.init({ watcher, previousInstance })
                },
              ),
            )
          } catch (error) {
            usedConfigs.delete(config)
            await Promise.allSettled([
              watcher.close(),
              ws.close(),
              Promise.allSettled(
                Object.values(environments).map((environment) =>
                  Promise.resolve().then(() => environment.close()),
                ),
              ),
              closeHttpServer(),
            ])
            throw error
          }
          '''
          new_init = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_init.splitlines()) + '\n'
          if old_init not in source:
              raise SystemExit('environment init block not found')
          source = source.replace(old_init, new_init, 1)

          duplicate_close = '  const closeHttpServer = createServerCloseFn(httpServer)\n\n'
          first = source.find(duplicate_close)
          second = source.find(duplicate_close, first + len(duplicate_close))
          if first == -1 or second == -1:
              raise SystemExit('expected duplicate closeHttpServer declaration')
          source = source[:second] + source[second + len(duplicate_close):]

          tail_start = '''  if (!middlewareMode) {
            setupSIGTERMListener(closeServerAndExit)
          }
          '''
          tail_start = '\n'.join(line[10:] if line.startswith('          ') else line for line in tail_start.splitlines()) + '\n'
          if tail_start not in source:
              raise SystemExit('post-server tail start not found')
          source = source.replace(tail_start, '  try {\n' + tail_start, 1)

          tail_end = '  return server\n}\n\nasync function startServer'
          replacement_end = '''    return server
            } catch (error) {
              usedConfigs.delete(config)
              await server.close()
              throw error
            }
          }

          async function startServer'''
          replacement_end = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement_end.splitlines())
          if tail_end not in source:
              raise SystemExit('post-server tail end not found')
          source = source.replace(tail_end, replacement_end, 1)

          path.write_text(source)
          PY

      - name: Build
        run: pnpm run build

      - name: Run focused construction regressions
        run: >-
          pnpm test-unit
          packages/vite/src/node/__tests__/failedRestartWatcher.spec.ts
          packages/vite/src/node/__tests__/failedResolvedConfigReuse.spec.ts
