name: Config resolve clone experiment

on:
  push:
    branches:
      - experiment/config-resolve-clone-boundary

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/config-resolve-clone-boundary

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Apply clone-boundary experiment
        shell: python
        run: |
          from pathlib import Path

          config_path = Path('packages/vite/src/node/config.ts')
          text = config_path.read_text()

          helper = r'''function cloneConfigForResolve<T>(value: T, key?: string): T {
            // Plugin objects are executable stateful values. Copy their containers while
            // preserving the plugin object identities used by the ecosystem.
            if (key === 'plugins') {
              if (Array.isArray(value)) {
                return value.map((plugin) =>
                  Array.isArray(plugin)
                    ? cloneConfigForResolve(plugin, 'plugins')
                    : plugin,
                ) as T
              }
              return value
            }

            // Custom loggers are executable stateful values too.
            if (key === 'customLogger') {
              return value
            }

            if (Array.isArray(value)) {
              return value.map((item) => cloneConfigForResolve(item)) as T
            }

            if (value && typeof value === 'object') {
              const prototype = Object.getPrototypeOf(value)
              if (prototype !== Object.prototype && prototype !== null) {
                // Keep opaque runtime values such as HTTP servers, Buffers, Agents,
                // Maps, Sets, and other class instances by reference.
                return value
              }

              const cloned = Object.create(prototype) as Record<string, unknown>
              for (const property of Object.keys(value)) {
                cloned[property] = cloneConfigForResolve(
                  (value as Record<string, unknown>)[property],
                  property,
                )
              }
              return cloned as T
            }

            return value
          }

          '''

          anchor = 'export async function resolveConfig(\n'
          if helper.strip() not in text:
            if anchor not in text:
              raise SystemExit('resolveConfig anchor missing')
            text = text.replace(anchor, helper + anchor, 1)

          old_start = '  let config = inlineConfig\n'
          new_start = '  let config = cloneConfigForResolve(inlineConfig)\n'
          if old_start not in text:
            raise SystemExit('resolveConfig start anchor missing')
          text = text.replace(old_start, new_start, 1)

          shallow_start_marker = (
            '  // Resolver-generated environment defaults must not be written back into\n'
          )
          next_section_marker = '  // Ensure default client and ssr environments\n'
          shallow_start = text.find(shallow_start_marker)
          if shallow_start == -1:
            raise SystemExit('existing shallow-copy patch start missing')
          shallow_end = text.find(next_section_marker, shallow_start)
          if shallow_end == -1:
            raise SystemExit('environment-default section missing')
          text = text[:shallow_start] + text[shallow_end:]
          config_path.write_text(text)

          test_path = Path(
            'packages/vite/src/node/__tests__/configResolveCloneBoundary.spec.ts'
          )
          test_path.write_text(r'''import { Buffer } from 'node:buffer'
          import { createServer as createHttpServer } from 'node:http'
          import { expect, test } from 'vitest'
          import type { InlineConfig } from '..'
          import { resolveConfig } from '../config'

          test('keeps resolver defaults out of the caller inline config', async () => {
            const inlineConfig: InlineConfig = {
              configFile: false,
              logLevel: 'silent',
            }

            await resolveConfig(inlineConfig, 'serve')

            expect(inlineConfig).toEqual({
              configFile: false,
              logLevel: 'silent',
            })
          })

          test('keeps config-hook mutation out of the caller inline config', async () => {
            const inlineConfig: InlineConfig = {
              configFile: false,
              logLevel: 'silent',
              resolve: {
                conditions: ['original'],
              },
              plugins: [
                {
                  name: 'test:mutate-config-hook-input',
                  config(config) {
                    config.resolve!.conditions!.push('from-hook')
                  },
                },
              ],
            }

            const resolved = await resolveConfig(inlineConfig, 'serve')

            expect(resolved.resolve.conditions).toContain('from-hook')
            expect(inlineConfig.resolve?.conditions).toEqual(['original'])
          })

          test('keeps repeated optimizer resolution idempotent', async () => {
            const optimizerPlugin = {
              name: 'test:clone-boundary-idempotence',
            }
            const inlineConfig: InlineConfig = {
              configFile: false,
              logLevel: 'silent',
              optimizeDeps: {
                rolldownOptions: {
                  plugins: [optimizerPlugin],
                },
              },
            }

            const first = await resolveConfig(inlineConfig, 'serve')
            const second = await resolveConfig(inlineConfig, 'serve')

            expect(first.environments.client.optimizeDepsPluginNames).toEqual([
              optimizerPlugin.name,
            ])
            expect(second.environments.client.optimizeDepsPluginNames).toEqual([
              optimizerPlugin.name,
            ])
          })

          test('preserves user plugin identity', async () => {
            const plugin = {
              name: 'test:clone-boundary-plugin-identity',
            }

            const resolved = await resolveConfig(
              {
                configFile: false,
                logLevel: 'silent',
                plugins: [plugin],
              },
              'serve',
            )

            expect(resolved.plugins).toContain(plugin)
          })

          test('preserves an opaque HTTP server reference', async () => {
            const httpServer = createHttpServer()
            try {
              const resolved = await resolveConfig(
                {
                  configFile: false,
                  logLevel: 'silent',
                  server: {
                    ws: { server: httpServer },
                  },
                },
                'serve',
              )

              expect(resolved.server.ws.server).toBe(httpServer)
            } finally {
              httpServer.removeAllListeners()
            }
          })

          test('preserves Buffer values in inline HTTPS options', async () => {
            const key = Buffer.from('test-key')

            const resolved = await resolveConfig(
              {
                configFile: false,
                logLevel: 'silent',
                server: {
                  https: { key },
                },
              },
              'serve',
            )

            expect(resolved.server.https?.key).toBe(key)
          })
          ''')

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile

      - name: Format experiment
        run: pnpm exec oxfmt --write packages/vite/src/node/config.ts packages/vite/src/node/__tests__/configResolveCloneBoundary.spec.ts

      - name: Run focused regression tests
        run: pnpm test-unit packages/vite/src/node/__tests__/configResolveCloneBoundary.spec.ts

      - name: Commit experiment
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/vite/src/node/config.ts packages/vite/src/node/__tests__/configResolveCloneBoundary.spec.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "experiment: clone config before resolution"
          git push origin HEAD:experiment/config-resolve-clone-boundary
