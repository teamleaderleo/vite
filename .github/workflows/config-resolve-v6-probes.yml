name: Config resolve ownership v6 probes

on:
  push:
    branches:
      - experiment/config-resolve-input-ownership-v6-probes

permissions: {}

jobs:
  probes:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm --filter vite typecheck
      - run: pnpm test-unit packages/vite/src/node/__tests__/configResolveOwnershipV6Probe.spec.ts
