name: Fieldwork proxy upgrade cleanup publisher

on:
  push:
    branches:
      - fieldwork/carrier-proxy-upgrade-cleanup-publish

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Apply bounded proxy listener cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target_branch='fix/fieldwork-662-proxy-upgrade-cleanup'
          git fetch origin "$target_branch"
          git checkout -B "$target_branch" "origin/$target_branch"

          python <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          proxy_path = Path('packages/vite/src/node/server/middlewares/proxy.ts')
          proxy = proxy_path.read_text()
          proxy = replace_once(
              proxy,
              "): Connect.NextHandleFunction {\n",
              "): Connect.NextHandleFunction & { close: () => void } {\n",
              'proxy return type',
          )
          proxy = replace_once(
              proxy,
              "  if (httpServer) {\n    httpServer.on('upgrade', async (req, socket, head) => {\n",
              "  let upgradeHandler:\n    | ((\n        req: http.IncomingMessage,\n        socket: import('node:stream').Duplex,\n        head: Buffer,\n      ) => void)\n    | undefined\n\n  if (httpServer) {\n    upgradeHandler = async (req, socket, head) => {\n",
              'upgrade handler declaration',
          )
          proxy = replace_once(
              proxy,
              "    })\n  }\n\n  // Keep the named function. The name is visible in debug logs via `DEBUG=connect:dispatcher ...`\n",
              "    }\n    httpServer.on('upgrade', upgradeHandler)\n  }\n\n  // Keep the named function. The name is visible in debug logs via `DEBUG=connect:dispatcher ...`\n",
              'upgrade handler registration',
          )
          proxy = replace_once(
              proxy,
              "  return async function viteProxyMiddleware(req, res, next) {\n",
              "  const viteProxyMiddleware = async function viteProxyMiddleware(req, res, next) {\n",
              'middleware binding',
          )
          proxy = replace_once(
              proxy,
              "    next()\n  }\n}\n\nfunction doesProxyContextMatchUrl(context: string, url: string): boolean {\n",
              "    next()\n  }\n\n  return Object.assign(viteProxyMiddleware, {\n    close() {\n      if (httpServer && upgradeHandler) {\n        httpServer.off('upgrade', upgradeHandler)\n      }\n    },\n  })\n}\n\nfunction doesProxyContextMatchUrl(context: string, url: string): boolean {\n",
              'middleware cleanup return',
          )
          proxy_path.write_text(proxy)

          server_path = Path('packages/vite/src/node/server/index.ts')
          server = server_path.read_text()
          server = replace_once(
              server,
              "  const devHtmlTransformFn = createDevHtmlTransformFn(config)\n\n  // Promise used by `server.close()` to ensure `closeServer()` is only called once\n",
              "  const devHtmlTransformFn = createDevHtmlTransformFn(config)\n  let proxyMiddlewareInstance: ReturnType<typeof proxyMiddleware> | undefined\n\n  // Promise used by `server.close()` to ensure `closeServer()` is only called once\n",
              'proxy lifecycle owner',
          )
          server = replace_once(
              server,
              "    if (!middlewareMode) {\n      teardownSIGTERMListener(closeServerAndExit)\n    }\n\n    await Promise.allSettled([\n",
              "    if (!middlewareMode) {\n      teardownSIGTERMListener(closeServerAndExit)\n    }\n    proxyMiddlewareInstance?.close()\n\n    await Promise.allSettled([\n",
              'server close cleanup',
          )
          server = replace_once(
              server,
              "    middlewares.use(proxyMiddleware(middlewareServer, proxy, config))\n",
              "    proxyMiddlewareInstance = proxyMiddleware(middlewareServer, proxy, config)\n    middlewares.use(proxyMiddlewareInstance)\n",
              'proxy middleware registration',
          )
          server_path.write_text(server)
          PY

          git diff --check
          git diff -- packages/vite/src/node/server/index.ts packages/vite/src/node/server/middlewares/proxy.ts
          git config user.name 'fieldwork-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/vite/src/node/server/index.ts packages/vite/src/node/server/middlewares/proxy.ts
          git commit -m 'fix(dev): remove proxy upgrade listener on close'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${target_branch}"
