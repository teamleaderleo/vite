name: Fieldwork watchChange plugin settlement repair

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: fieldwork-watchchange-plugin-settlement
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/fieldwork-25-watchchange-error-isolation
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Apply plugin settlement repair
        run: |
          python3 <<'PY'
          from pathlib import Path

          container = Path('packages/vite/src/node/server/pluginContainer.ts')
          text = container.read_text()
          marker = "  async buildStart(_options?: InputOptions): Promise<void> {\n"
          helper = """  private async hookParallelWithErrorHandler<
            H extends AsyncPluginHooks & ParallelPluginHooks,
          >(
            hookName: H,
            context: (plugin: Plugin) => ThisType<FunctionPluginHooks[H]>,
            args: (plugin: Plugin) => Parameters<FunctionPluginHooks[H]>,
            onError: (error: Parameters<Logger['error']>[0]) => void,
            condition?: (plugin: Plugin) => boolean | undefined,
          ): Promise<void> {
            const parallelPromises: Promise<void>[] = []
            const runHook = async (plugin: Plugin) => {
              const hook = plugin[hookName]
              const handler: Function = getHookHandler(hook)
              try {
                await this.handleHookPromise(
                  handler.apply(context(plugin), args(plugin)),
                )
              } catch (error) {
                onError(error as Parameters<Logger['error']>[0])
              }
            }

            for (const plugin of this.getSortedPlugins(hookName)) {
              if (condition && !condition(plugin)) continue

              const hook = plugin[hookName]
              if ((hook as { sequential?: boolean }).sequential) {
                await Promise.all(parallelPromises)
                parallelPromises.length = 0
                await runHook(plugin)
              } else {
                parallelPromises.push(runHook(plugin))
              }
            }
            await Promise.all(parallelPromises)
          }

"""
          if 'hookParallelWithErrorHandler' not in text:
            if marker not in text:
              raise SystemExit('buildStart marker not found')
            text = text.replace(marker, helper + marker, 1)

          old = """  async watchChange(
            id: string,
            change: { event: 'create' | 'update' | 'delete' },
          ): Promise<void> {
            const config = this.environment.getTopLevelConfig()
            await this.hookParallel(
              'watchChange',
              (plugin) => this._getPluginContext(plugin),
              () => [id, change],
              (plugin) =>
                this.environment.name === 'client' ||
                config.server.perEnvironmentWatchChangeDuringDev ||
                plugin.perEnvironmentWatchChangeDuringDev,
            )
          }
"""
          new = """  async watchChange(
            id: string,
            change: { event: 'create' | 'update' | 'delete' },
            onError?: (error: Parameters<Logger['error']>[0]) => void,
          ): Promise<void> {
            const config = this.environment.getTopLevelConfig()
            const condition = (plugin: Plugin) =>
              this.environment.name === 'client' ||
              config.server.perEnvironmentWatchChangeDuringDev ||
              plugin.perEnvironmentWatchChangeDuringDev

            if (onError) {
              await this.hookParallelWithErrorHandler(
                'watchChange',
                (plugin) => this._getPluginContext(plugin),
                () => [id, change],
                onError,
                condition,
              )
            } else {
              await this.hookParallel(
                'watchChange',
                (plugin) => this._getPluginContext(plugin),
                () => [id, change],
                condition,
              )
            }
          }
"""
          if old not in text:
            raise SystemExit('watchChange method marker not found')
          container.write_text(text.replace(old, new, 1))

          server = Path('packages/vite/src/node/server/index.ts')
          text = server.read_text()
          old = "        environment.pluginContainer.watchChange(file, { event }),\n"
          new = """        environment.pluginContainer.watchChange(file, { event }, (error) =>
          server.config.logger.error(error),
        ),
"""
          if old not in text:
            raise SystemExit('server call marker not found')
          server.write_text(text.replace(old, new, 1))
          PY

      - name: Add adversarial controls
        run: |
          python3 <<'PY'
          from pathlib import Path

          test_file = Path('packages/vite/src/node/__tests__/server/watchChange-error-isolation.spec.js')
          text = test_file.read_text()
          marker = 'async function writeProject(root, files) {'
          tests = r"""
test('settles every watchChange hook before HMR and preserves barriers', async () => {
  const root = await mkdtemp(path.join(os.tmpdir(), 'vite-watch-change-'))
  onTestFinished(() => rm(root, { recursive: true, force: true }))

  const stateFile = path.join(root, 'state.txt')
  await writeProject(root, { 'state.txt': 'alpha\n' })

  const fastError = new Error('fast watchChange rejection')
  const slowError = new Error('slow watchChange rejection')
  const slowStarted = promiseWithResolvers()
  const releaseSlow = promiseWithResolvers()
  const fastLogged = promiseWithResolvers()
  const hotUpdateCalled = promiseWithResolvers()
  const events = []
  const loggedErrors = []

  const logger = createLogger('silent')
  logger.error = (error) => {
    loggedErrors.push(error)
    if (error === fastError) fastLogged.resolve()
  }

  const server = await createServer({
    root,
    configFile: false,
    logLevel: 'silent',
    customLogger: logger,
    plugins: [
      {
        name: 'fast-watch-change',
        async watchChange(id) {
          if (path.resolve(id) !== stateFile) return
          events.push('fast:start')
          await slowStarted.promise
          events.push('fast:error')
          throw fastError
        },
      },
      {
        name: 'slow-watch-change',
        async watchChange(id) {
          if (path.resolve(id) !== stateFile) return
          events.push('slow:start')
          slowStarted.resolve()
          await releaseSlow.promise
          events.push('slow:error')
          throw slowError
        },
      },
      {
        name: 'sequential-watch-change',
        watchChange: {
          sequential: true,
          handler(id) {
            if (path.resolve(id) === stateFile) events.push('sequential')
          },
        },
      },
      {
        name: 'later-watch-change',
        watchChange(id) {
          if (path.resolve(id) === stateFile) events.push('later')
        },
      },
      {
        name: 'watch-change-observer',
        hotUpdate({ file }) {
          if (this.environment.name !== 'client') return
          if (path.resolve(file) === stateFile) {
            events.push('hmr')
            hotUpdateCalled.resolve()
            return []
          }
        },
      },
    ],
    server: { middlewareMode: true, ws: false },
  })
  onTestFinished(async () => {
    releaseSlow.resolve()
    await server.close()
  })

  server.watcher.emit('change', stateFile)

  await withTimeout(fastLogged.promise, 'fast error was not logged')
  await new Promise((resolve) => setImmediate(resolve))
  expect(events).toEqual(['fast:start', 'slow:start', 'fast:error'])

  releaseSlow.resolve()
  await withTimeout(hotUpdateCalled.promise, 'hotUpdate hook was not reached')

  expect(loggedErrors).toEqual([fastError, slowError])
  expect(events).toEqual([
    'fast:start',
    'slow:start',
    'fast:error',
    'slow:error',
    'sequential',
    'later',
    'hmr',
  ])
})

test('continues later watchChange hooks after a synchronous error', async () => {
  const root = await mkdtemp(path.join(os.tmpdir(), 'vite-watch-change-'))
  onTestFinished(() => rm(root, { recursive: true, force: true }))

  const stateFile = path.join(root, 'state.txt')
  await writeProject(root, { 'state.txt': 'alpha\n' })

  const watchChangeError = new Error('synchronous watchChange rejection')
  const hotUpdateCalled = promiseWithResolvers()
  const loggedErrors = []
  let laterWatchChangeCalled = false

  const logger = createLogger('silent')
  logger.error = (error) => loggedErrors.push(error)

  const server = await createServer({
    root,
    configFile: false,
    logLevel: 'silent',
    customLogger: logger,
    plugins: [
      {
        name: 'throwing-watch-change',
        watchChange(id) {
          if (path.resolve(id) === stateFile) throw watchChangeError
        },
      },
      {
        name: 'later-watch-change',
        watchChange(id) {
          if (path.resolve(id) === stateFile) laterWatchChangeCalled = true
        },
      },
      {
        name: 'watch-change-observer',
        hotUpdate({ file }) {
          if (this.environment.name !== 'client') return
          if (path.resolve(file) === stateFile) {
            hotUpdateCalled.resolve()
            return []
          }
        },
      },
    ],
    server: { middlewareMode: true, ws: false },
  })
  onTestFinished(() => server.close())

  server.watcher.emit('change', stateFile)

  await withTimeout(hotUpdateCalled.promise, 'hotUpdate hook was not reached')
  expect(laterWatchChangeCalled).toBe(true)
  expect(loggedErrors).toContain(watchChangeError)
})

"""
          if 'settles every watchChange hook before HMR' not in text:
            if marker not in text:
              raise SystemExit('test helper marker not found')
            text = text.replace(marker, tests + marker, 1)
          test_file.write_text(text)
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed source
        run: |
          pnpm exec oxfmt --write \
            packages/vite/src/node/server/index.ts \
            packages/vite/src/node/server/pluginContainer.ts \
            packages/vite/src/node/__tests__/server/watchChange-error-isolation.spec.js

      - name: Build Vite
        run: pnpm run build

      - name: Run focused watchChange tests
        run: pnpm exec vitest run packages/vite/src/node/__tests__/server/watchChange-error-isolation.spec.js

      - name: Lint changed source
        run: |
          pnpm exec eslint \
            packages/vite/src/node/server/index.ts \
            packages/vite/src/node/server/pluginContainer.ts \
            packages/vite/src/node/__tests__/server/watchChange-error-isolation.spec.js

      - name: Commit repaired source and remove workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/fieldwork-watchchange-plugin-settlement.yml
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git add \
            packages/vite/src/node/server/index.ts \
            packages/vite/src/node/server/pluginContainer.ts \
            packages/vite/src/node/__tests__/server/watchChange-error-isolation.spec.js \
            .github/workflows/fieldwork-watchchange-plugin-settlement.yml
          git commit -m "fix(dev): settle watchChange hooks before invalidation"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/fieldwork-25-watchchange-error-isolation
