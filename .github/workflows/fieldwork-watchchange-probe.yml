name: Fieldwork watchChange probe

permissions: {}

on:
  push:
    branches:
      - research/fieldwork-25-watchchange-isolation
    paths:
      - research/fieldwork-25/watchchange-error/**
      - .github/workflows/fieldwork-watchchange-probe.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  probe:
    name: Reproduce stale cache after watchChange rejection
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Vite
        run: pnpm run build

      - name: Run watchChange probe
        run: node research/fieldwork-25/watchchange-error/probe.mjs
