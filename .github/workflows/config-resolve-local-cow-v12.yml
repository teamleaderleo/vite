name: Config resolve ownership local cow v12

on:
  push:
    branches:
      - experiment/config-resolve-input-ownership-local-cow-v12-ci

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: experiment/config-resolve-input-ownership-local-cow-v12-ci
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile
      - run: python .github/scripts/config-resolve-local-cow-v12.py
      - run: pnpm exec oxfmt --write packages/vite/src/node/config.ts packages/vite/src/node/utils.ts packages/vite/src/node/__tests__/configResolveInputOwnershipLocal.spec.ts
      - run: pnpm exec eslint packages/vite/src/node/config.ts packages/vite/src/node/utils.ts packages/vite/src/node/__tests__/configResolveInputOwnershipLocal.spec.ts
      - run: pnpm run build
      - run: pnpm --filter vite typecheck
      - run: pnpm test-unit packages/vite/src/node/__tests__/config.spec.ts packages/vite/src/node/__tests__/configResolveInputOwnershipLocal.spec.ts packages/vite/src/node/__tests__/plugins/terser.spec.ts
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/vite/src/node/config.ts packages/vite/src/node/utils.ts packages/vite/src/node/__tests__/configResolveInputOwnershipLocal.spec.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit --no-verify -m "experiment: fix remaining config ownership leaks"
          git push origin HEAD:experiment/config-resolve-input-ownership-local-cow-v12-ci
