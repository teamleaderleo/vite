# promotion trigger
name: Promote Config Clone Candidate

permissions:
  contents: write

on:
  push:
    branches:
      - research/config-clone-patched-ci

jobs:
  promote:
    if: ${{ startsWith(github.event.head_commit.message, 'promote: config clone candidate') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Apply production candidate
        run: node scripts/research-config-clone-patch.mjs

      - name: Drop research-only harness files
        run: |
          rm -f .github/workflows/research-config-clone.yml
          rm -f .github/workflows/promote-config-clone-candidate.yml
          rm -f scripts/research-config-clone-patch.mjs
          rm -f packages/vite/src/node/__tests__/configResolveClonePrototype.spec.ts

      - name: Commit candidate branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -C fix/config-resolve-input-ownership
          git add -A
          git commit -m "fix(config): isolate resolveConfig working config"
          git push --force origin HEAD:fix/config-resolve-input-ownership
